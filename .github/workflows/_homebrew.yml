name: Publish - Homebrew

# Reusable workflow: renders the Homebrew formula from templates/<pkg>.rb and
# opens an auto-merging PR against techprimate/homebrew-tap.
#
# sha256 values are taken from the source release's checksums.txt — the publisher
# copies those exact binaries to the registry, so the hashes match what is served.

on:
  workflow_call:
    inputs:
      source_repo:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Compute release metadata
        id: meta
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          project="${SOURCE_REPO##*/}"
          manifest="packages/${project}/manifest.yaml"
          test -f "$manifest"
          version="${TAG#v}"
          {
            echo "repo_name=${project}"
            echo "version=${version}"
            echo "binary=$(yq -er '.binary' "$manifest")"
            echo "formula=$(yq -er '.homebrew_formula' "$manifest")"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate source release token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TECHPRIMATE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TECHPRIMATE_RELEASE_BOT_PRIVATE_KEY }}
          owner: techprimate
          repositories: ${{ steps.meta.outputs.repo_name }}
          permission-contents: read

      - name: Extract SHA256 values from source release
        id: checksums
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -eo pipefail
          gh release download "${{ inputs.tag }}" \
            --repo "${{ inputs.source_repo }}" \
            --pattern "checksums.txt" \
            --dir .

          extract_sha() {
            local sha
            sha=$(grep "$1\$" checksums.txt | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "Error: No checksum found for $1" >&2
              exit 1
            fi
            echo "$sha"
          }

          binary="${{ steps.meta.outputs.binary }}"
          manifest="${{ steps.meta.outputs.manifest }}"
          configured_sha() {
            local platform="$1"
            if yq -e ".platforms[] | select(. == \"${platform}\")" "$manifest" >/dev/null; then
              extract_sha "${binary}-${platform}"
            fi
          }
          {
            echo "darwin_amd64=$(configured_sha darwin-amd64)"
            echo "darwin_arm64=$(configured_sha darwin-arm64)"
            echo "linux_amd64=$(configured_sha linux-amd64)"
            echo "linux_arm64=$(configured_sha linux-arm64)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TECHPRIMATE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TECHPRIMATE_RELEASE_BOT_PRIVATE_KEY }}
          owner: techprimate
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.tap-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: techprimate/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap

      - name: Render formula
        env:
          FORMULA: ${{ steps.meta.outputs.formula }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA_DARWIN_AMD64: ${{ steps.checksums.outputs.darwin_amd64 }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.checksums.outputs.linux_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
        run: |
          set -eo pipefail
          mkdir -p homebrew-tap/Formula
          ruby scripts/render_homebrew.rb "templates/${FORMULA}.rb" "homebrew-tap/Formula/${FORMULA}.rb"

      - name: Create PR on Homebrew tap
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          branch: update-${{ steps.meta.outputs.formula }}-${{ steps.meta.outputs.version }}
          delete-branch: true
          commit-message: "feat: update ${{ steps.meta.outputs.formula }} to ${{ steps.meta.outputs.version }}"
          committer: "${{ steps.tap-token.outputs.app-slug }}[bot] <${{ steps.app-user.outputs.user-id }}+${{ steps.tap-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
          author: "${{ steps.tap-token.outputs.app-slug }}[bot] <${{ steps.app-user.outputs.user-id }}+${{ steps.tap-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
          title: "feat: update ${{ steps.meta.outputs.formula }} to ${{ steps.meta.outputs.version }}"
          body: "Automated formula update for `${{ inputs.source_repo }}@${{ inputs.tag }}`."

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          gh pr merge --squash --auto "${{ steps.create-pr.outputs.pull-request-number }}" \
            --repo techprimate/homebrew-tap
