# Per-project packaging config for `apple-docs`, consumed by `nfpm pkg`.
#
# Descriptions/changelogs are templated explicitly here and NEVER auto-derived
# from the (private) source git history — see AGENTS.md "No metadata bleed".
#
# Environment variables are expanded by nfpm at build time. The publisher sets:
#   ARCH    nfpm arch (amd64|arm64) — nfpm maps amd64→x86_64, arm64→aarch64 for rpm
#   GOARCH  Go arch (amd64|arm64)   — matches the release asset filename suffix
#   VERSION semver without the leading "v"
#   MTIME   RFC3339 timestamp pinned to the source tag's commit date (reproducible builds)
name: apple-docs
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: techprimate <opensource@techprimate.app>
description: CLI to explore Apple Developer Documentation
vendor: techprimate
homepage: https://github.com/techprimate/apple-docs
license: FSL-1.1-MIT

# Pin file/package timestamps so the same tag yields byte-identical artifacts.
mtime: ${MTIME}

contents:
  # src uses Go arch naming (amd64/arm64) to match the release asset filenames;
  # the `arch` field above uses nfpm arch, mapped to x86_64/aarch64 for rpm.
  - src: dist/apple-docs-linux-${GOARCH}
    dst: /usr/bin/apple-docs
    file_info:
      mode: 0755
